<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>رصدگر بازار</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            background:
                #0b1020;

            color:
                #ffffff;

            padding:
                20px;
        }

        .container {

            max-width:
                1200px;

            margin:
                auto;
        }

        h1 {

            margin-bottom:
                5px;
        }

        .subtitle {

            color:
                #aab3c5;

            margin-bottom:
                25px;
        }

        .status {

            padding:
                15px;

            border-radius:
                12px;

            background:
                #151d33;

            margin-bottom:
                20px;
        }

        .online {

            color:
                #42e695;

            font-weight:
                bold;
        }

        .cards {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        180px,
                        1fr
                    )
                );

            gap:
                15px;

            margin-bottom:
                25px;
        }

        .card {

            background:
                #151d33;

            padding:
                20px;

            border-radius:
                15px;

            border:
                1px solid #273354;
        }

        .card-title {

            color:
                #aab3c5;

            font-size:
                14px;

            margin-bottom:
                8px;
        }

        .card-value {

            font-size:
                25px;

            font-weight:
                bold;
        }

        .alert {

            background:
                #151d33;

            border:
                1px solid #273354;

            border-radius:
                15px;

            padding:
                20px;

            margin-bottom:
                15px;
        }

        .alert-header {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                10px;

            flex-wrap:
                wrap;

            margin-bottom:
                15px;
        }

        .symbol {

            font-size:
                24px;

            font-weight:
                bold;
        }

        .badge {

            padding:
                6px 12px;

            border-radius:
                20px;

            background:
                #263453;
        }

        .buy {

            color:
                #42e695;
        }

        .sell {

            color:
                #ff6b6b;
        }

        .whale {

            margin-top:
                15px;

            padding:
                15px;

            border-radius:
                12px;

            background:
                #10182b;
        }

        .grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        150px,
                        1fr
                    )
                );

            gap:
                10px;

            margin-top:
                15px;
        }

        .item {

            background:
                #10182b;

            padding:
                12px;

            border-radius:
                10px;
        }

        .label {

            color:
                #8f9bb3;

            font-size:
                12px;

            margin-bottom:
                5px;
        }

        .value {

            font-weight:
                bold;
        }

        .empty {

            text-align:
                center;

            padding:
                50px;

            color:
                #8f9bb3;
        }

        button {

            border:
                none;

            border-radius:
                10px;

            padding:
                10px 18px;

            cursor:
                pointer;

            background:
                #263b70;

            color:
                white;

            font-size:
                14px;
        }

        button:hover {

            background:
                #34519a;
        }

        .topbar {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

            flex-wrap:
                wrap;

            margin-bottom:
                20px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="topbar">

        <div>

            <h1>
                📡 رصدگر بازار
            </h1>

            <div class="subtitle">
                پنل آنلاین تحلیل و هشدار بازار
            </div>

        </div>

        <button
            onclick="loadData()"
        >
            🔄 بروزرسانی
        </button>

    </div>


    <div
        class="status"
        id="status"
    >
        در حال اتصال...
    </div>


    <div class="cards">

        <div class="card">

            <div class="card-title">
                وضعیت سرور
            </div>

            <div
                class="card-value"
                id="serverStatus"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                ارزهای تحت بررسی
            </div>

            <div
                class="card-value"
                id="coinCount"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                فاصله بررسی
            </div>

            <div
                class="card-value"
                id="interval"
            >
                -
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                تعداد هشدارها
            </div>

            <div
                class="card-value"
                id="alertCount"
            >
                -
            </div>

        </div>

    </div>


    <h2>
        🚨 آخرین هشدارها
    </h2>


    <div id="alerts">

        <div class="empty">
            در حال دریافت اطلاعات...
        </div>

    </div>

</div>


<script>

async function api(
    path
) {

    const response =
        await fetch(path);

    if (
        !response.ok
    ) {

        throw new Error(
            "خطا در دریافت اطلاعات"
        );
    }

    return response.json();
}


/* =========================
   نمایش هشدار
========================= */

function renderAlert(
    alert
) {

    const signal =
        alert.signal || "-";


    const signalClass =
        signal === "BUY"
            ? "buy"
            : signal === "SELL"
                ? "sell"
                : "";


    const whale =
        alert.whale || {};


    return `

        <div class="alert">

            <div class="alert-header">

                <div class="symbol">

                    ${alert.symbol}

                    <span
                        class="${signalClass}"
                    >
                        ${signal}
                    </span>

                </div>

                <div class="badge">

                    اولویت:
                    ${alert.priority || "-"}

                </div>

            </div>


            <div class="grid">

                <div class="item">

                    <div class="label">
                        قدرت
                    </div>

                    <div class="value">
                        ${alert.strength || "-"}
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        اعتماد ترکیبی
                    </div>

                    <div class="value">
                        ${alert.combinedConfidence || "-"}
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        قیمت
                    </div>

                    <div class="value">
                        $${alert.priceFormatted || "-"}
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        RSI
                    </div>

                    <div class="value">
                        ${
                            alert.rsi !== null &&
                            alert.rsi !== undefined
                                ? Number(alert.rsi).toFixed(2)
                                : "-"
                        }
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        امتیاز
                    </div>

                    <div class="value">
                        ${alert.score ?? "-"}
                    </div>

                </div>


                <div class="item">

                    <div class="label">
                        روند
                    </div>

                    <div class="value">
                        ${alert.trend || "-"}
                    </div>

                </div>

            </div>


            <div class="whale">

                🐋
                <strong>
                    فعالیت بازار
                </strong>

                <div class="grid">

                    <div class="item">

                        <div class="label">
                            جهت
                        </div>

                        <div class="value">
                            ${whale.signal || "-"}
                        </div>

                    </div>


                    <div class="item">

                        <div class="label">
                            شدت
                        </div>

                        <div class="value">
                            ${whale.level || "-"}
                        </div>

                    </div>


                    <div class="item">

                        <div class="label">
                            نسبت حجم
                        </div>

                        <div class="value">
                            ${whale.volumeRatio ?? "-"}x
                        </div>

                    </div>


                    <div class="item">

                        <div class="label">
                            تغییر قیمت
                        </div>

                        <div class="value">
                            ${whale.priceChange ?? "-"}%
                        </div>

                    </div>

                </div>

            </div>


            <div
                style="
                    margin-top:15px;
                    color:#8f9bb3;
                    font-size:13px;
                "
            >

                🕒 ${alert.timeLocal || "-"}

            </div>


            <div
                style="
                    margin-top:12px;
                    color:#ffcf66;
                    font-size:12px;
                "
            >

                ⚠️ این هشدار تحلیل احتمالی بازار است،
                نه تضمین حرکت قیمت.

            </div>

        </div>

    `;
}


/* =========================
   دریافت اطلاعات
========================= */

async function loadData() {

    try {

        const health =
            await api(
                "/"
            );


        document
            .getElementById(
                "status"
            )
            .innerHTML =

                `
                🟢 سرور آنلاین است
                `;


        document
            .getElementById(
                "serverStatus"
            )
            .innerText =
                "ONLINE";


        document
            .getElementById(
                "coinCount"
            )
            .innerText =
                health.monitoredCoins;


        document
            .getElementById(
                "interval"
            )
            .innerText =
                health.intervalSeconds +
                " ثانیه";


        const data =
            await api(
                "/alerts"
            );


        document
            .getElementById(
                "alertCount"
            )
            .innerText =
                data.count;


        const container =
            document
                .getElementById(
                    "alerts"
                );


        if (
            !data.alerts ||
            data.alerts.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    هنوز هشدار مناسبی
                    ثبت نشده است.

                </div>

            `;

            return;
        }


        container.innerHTML =
            data.alerts
                .map(
                    renderAlert
                )
                .join("");


    } catch (error) {

        console.error(
            error
        );


        document
            .getElementById(
                "status"
            )
            .innerHTML =

                `
                🔴 اتصال به سرور برقرار نشد
                `;

        document
            .getElementById(
                "serverStatus"
            )
            .innerText =
                "OFFLINE";

    }

}


/* =========================
   شروع
========================= */

loadData();


/* =========================
   بروزرسانی خودکار
========================= */

setInterval(
    loadData,
    30 * 1000
);

</script>

</body>

</html>
